[package]
name = "surveillance"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Platform-independent aircraft tracking from radio, panel, network, and replay traffic"
license = "MIT"

[workspace]
members = [
    "crates/surveillance-aero-link",
    "crates/surveillance-core",
    "crates/surveillance-geojson",
    "crates/surveillance-replay",
]
default-members = ["."]
resolver = "3"

[workspace.dependencies]
aero-link = { path = "../aero-link", default-features = false }
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
getrandom = "0.4"
libm = "0.2"
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
thiserror = { version = "2.0", default-features = false }
tracing = "0.1"
tracing-subscriber = "0.3"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
await_holding_lock = "deny"
expect_used = "deny"
let_underscore_future = "deny"
let_underscore_must_use = "deny"
panic = "deny"
unwrap_used = "deny"

[lib]
name = "surveillance"
path = "src/lib.rs"

[features]
default = []
std = ["surveillance-core/std", "surveillance-aero-link?/std"]
# Radio input is opt-in: the portable default build never links a decoder.
aero-link = ["dep:surveillance-aero-link"]

[dependencies]
surveillance-core = { version = "0.1.0", path = "crates/surveillance-core", default-features = false }
surveillance-aero-link = { version = "0.1.0", path = "crates/surveillance-aero-link", default-features = false, optional = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
