[package]
name = "surveillance-aero-link"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Normalizes aero-link radio receptions into canonical Surveillance observations"
license = "MIT"

[features]
default = []
# The recorded-stream reader needs an I/O trait and a JSON decoder, so it is
# host-only. A portable build keeps the one-reception normalization and links
# neither.
std = ["aero-link/std", "dep:serde_json", "surveillance-core/std", "thiserror/std"]

[dependencies]
aero-link = { workspace = true }
libm = { workspace = true }
serde_json = { workspace = true, optional = true }
surveillance-core = { version = "0.1.0", path = "../surveillance-core", default-features = false }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
